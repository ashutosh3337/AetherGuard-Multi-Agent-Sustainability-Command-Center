# Firebase App Hosting (Cloud Run under the hood) configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Secrets are referenced by NAME from Secret Manager — values never appear in
# the repo or the client bundle. Grant access with:
#   firebase apphosting:secrets:set gemini-api-key
#   firebase apphosting:secrets:grantaccess gemini-api-key --backend aetherguard

runConfig:
  minInstances: 1        # keep one warm instance → no cold start on the command center
  maxInstances: 10       # cost / blast-radius ceiling
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # ── Public web config (also needed at BUILD for NEXT_PUBLIC_ inlining) ─────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "replace-with-web-api-key"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "your-project.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "your-project"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "replace-with-app-id"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION
    value: "us-central1"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: "replace-with-recaptcha-enterprise-site-key"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]

  # ── Server-only config ─────────────────────────────────────────────────────
  - variable: FIREBASE_PROJECT_ID
    value: "your-project"
    availability: [RUNTIME]
  - variable: APP_CHECK_ENFORCE
    value: "true"
    availability: [RUNTIME]
  - variable: SESSION_COOKIE_MAX_AGE_DAYS
    value: "5"
    availability: [RUNTIME]
  - variable: ALLOWED_ORIGINS
    value: "https://aetherguard.web.app"
    availability: [RUNTIME]

  # ── Secrets (Secret Manager) — used from Phase 4 by the agent gateway ──────
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
    availability: [RUNTIME]
